[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "explicit_enso_iod_model"
version = "0.1.0"
description = "Seasonal recharge-oscillator model of coupled ENSO/IOD variability: fitting, free runs, hindcasts"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
dependencies = ["numpy", "pandas", "scipy", "matplotlib"]

[project.optional-dependencies]
notebook = ["jupyter", "xarray", "netcdf4", "cftime"]   # xarray etc. only for the ORAS loader / index script
maps = ["xarray", "cartopy"]
test = ["pytest"]

[tool.setuptools]
packages = ["explicit_enso_iod_model"]
